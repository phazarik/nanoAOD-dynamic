# ==============================================================================
# REANA WORKFLOW CONFIGURATION
# Paths are relative to this file's location inside reana/
# filelists/ is produced by prepare.py, which runs on lxplus before the
# workflow is created, not inside REANA.
# ==============================================================================

version: 0.9.0

inputs:
  files:
    - Snakefile
    - samples.json
    - ../compile_and_run.C
    - ../runOnce.C
    - ../nanoAna.C
    - ../nanoAna.h
  directories:
    - ../headers
    - ../onnxruntime-linux-x64-1.24.4
    - ../trained_models
    - ../filelists
  parameters:
    eos_output_dir: /eos/user/p/phazarik/reana-test

workflow:
  type: snakemake
  file: Snakefile

outputs:
  directories:
    - ../outputs

